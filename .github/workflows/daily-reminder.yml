name: Daily Work Hours Reminder

# TESTING MODE: Trigger on push to feature branch and manual dispatch
on:
  # Enable manual testing
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode'
        required: false
        default: 'true'
  
  # Trigger on push to current feature branch for testing
  push:
    branches:
      - 'Feature/SetupReminder'
    paths:
      - '.github/workflows/daily-reminder.yml'
      - 'api/reminder.js'
  
  # PRODUCTION SCHEDULE (commented out for testing)
  # Uncomment these when ready to deploy to main branch
  # schedule:
  #   - cron: '0 15 * * 1-5'
  #   - cron: '30 17 * * 1-5'
  #   - cron: '45 19 * * 1-5'
  #   - cron: '15 21 * * 1-5'

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    
    steps:
      - name: Test Mode Check
        run: |
          echo "🧪 Running in TEST MODE on feature branch"
          echo "Branch: ${{ github.ref_name }}"
          echo "Test input: ${{ github.event.inputs.test_mode }}"
      
      - name: Send Test Reminder
        run: |
          echo "🎯 Testing reminder API call..."
          
          # Call your bot's reminder endpoint
          response=$(curl -X POST "${{ secrets.BOT_WEBHOOK_URL }}/api/reminder" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.REMINDER_SECRET }}" \
            -d '{
              "action": "send_daily",
              "user_id": "${{ secrets.AUTHORIZED_USER_ID }}",
              "source": "github_actions_test"
            }' \
            -w "%{http_code}" \
            -s)
            
          echo "Response: $response"
          
          if [[ "$response" == *"200" ]]; then
            echo "✅ Test reminder sent successfully!"
          else
            echo "❌ Test failed with response: $response"
            exit 1
          fi

      - name: Test Complete
        run: |
          echo "🎉 GitHub Actions test completed!"
          echo "📝 Next steps:"
          echo "1. Check if you received the test reminder on Telegram"
          echo "2. If working, uncomment the schedule in the workflow file"
          echo "3. Merge to main branch when ready for production"