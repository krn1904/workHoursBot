name: Daily Work Hours Reminder

# Run at random times between 3PM and 11PM UTC (15:00-23:00)
# This schedule runs multiple times to create randomness
on:
  schedule:
    # Run at 3:00 PM UTC (15:00)
    - cron: '0 15 * * 1-5'
    # Run at 5:30 PM UTC (17:30) 
    - cron: '30 17 * * 1-5'
    # Run at 7:45 PM UTC (19:45)
    - cron: '45 19 * * 1-5'
    # Run at 9:15 PM UTC (21:15)
    - cron: '15 21 * * 1-5'
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Random Reminder
        run: |
          # Generate random number to decide if reminder should be sent
          RANDOM_NUM=$((RANDOM % 4))
          
          # Only send reminder 25% of the time (1 out of 4 runs)
          if [ $RANDOM_NUM -eq 0 ]; then
            echo "🎯 Sending daily reminder..."
            
            # Call your bot's reminder endpoint
            curl -X POST "${{ secrets.BOT_WEBHOOK_URL }}/api/reminder" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.REMINDER_SECRET }}" \
              -d '{
                "action": "send_daily",
                "user_id": "${{ secrets.AUTHORIZED_USER_ID }}",
                "source": "github_actions"
              }' \
              --fail --silent --show-error
              
            echo "✅ Reminder sent successfully"
          else
            echo "⏭️ Skipping reminder this time (random selection)"
          fi

      - name: Log Reminder Attempt
        if: always()
        run: |
          echo "🕒 Reminder check completed at $(date)"
          echo "📅 Next potential reminder in ~2-3 hours"