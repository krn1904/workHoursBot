name: Daily Work Hours Reminder

# Enable automatic daily reminders and manual testing
on:
  # Enable manual testing
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode'
        required: false
        default: 'true'
  
  # PRODUCTION SCHEDULE - Automatic daily reminders
  # Runs 4 times daily with 25% chance each = ~1 reminder per day
  schedule:
    # 3:00 PM UTC (15:00)
    - cron: '0 15 * * 1-5'
    # 5:30 PM UTC (17:30) 
    - cron: '30 17 * * 1-5'
    # 7:45 PM UTC (19:45)
    - cron: '45 19 * * 1-5'
    # 9:15 PM UTC (21:15)
    - cron: '15 21 * * 1-5'
  
  # Trigger on push to current feature branch for testing
  push:
    branches:
      - 'Feature/SetupReminder'
    paths:
      - '.github/workflows/daily-reminder.yml'
      - 'api/reminder.js'

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "🔔 Running PRODUCTION scheduled reminder"
          else
            echo "🧪 Running in TEST MODE"
          fi
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
      
      - name: Send Reminder
        run: |
          # Generate random number for production mode
          if [ "${{ github.event_name }}" = "schedule" ]; then
            RANDOM_NUM=$((RANDOM % 4))
            echo "🎲 Random selection: $RANDOM_NUM (need 0 to send)"
            
            if [ $RANDOM_NUM -eq 0 ]; then
              echo "🎯 Sending production reminder..."
              SEND_REMINDER=true
            else
              echo "⏭️ Skipping reminder this time (random selection)"
              SEND_REMINDER=false
            fi
          else
            echo "🧪 Test mode - always sending reminder"
            SEND_REMINDER=true
          fi
          
          if [ "$SEND_REMINDER" = "true" ]; then
            # Call your bot's reminder endpoint
            response=$(curl -X POST "${{ secrets.BOT_WEBHOOK_URL }}/api/reminder" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.REMINDER_SECRET }}" \
              -d '{
                "action": "send_daily",
                "user_id": "${{ secrets.AUTHORIZED_USER_ID }}",
                "source": "github_actions_production"
              }' \
              -w "%{http_code}" \
              -s)
              
            echo "Response: $response"
            
            if [[ "$response" == *"200" ]]; then
              echo "✅ Reminder sent successfully!"
            else
              echo "❌ Failed with response: $response"
              exit 1
            fi
          else
            echo "✅ Completed without sending (random skip)"
          fi

      - name: Summary
        if: always()
        run: |
          echo "🕒 Reminder check completed at $(date)"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "📅 Next check in 2-3 hours (production mode)"
          else
            echo "🧪 This was a test run"
          fi